# Builds Ferry for Linux, Windows and macOS, and publishes the builds as a
# GitHub release when a version tag such as v0.3.0 is pushed. Started by hand
# from the Actions tab, it builds without publishing; the builds are kept as
# the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on older glibcs too.
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # The tarball, Debian package, RPM and AppImage.
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools
          packaging/linux/package.sh target/release/ferry 1 dist

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist work/ferry
          cp target/release/ferry.exe README.md LICENSE work/ferry/
          (cd work && 7z a ../dist/ferry-windows-x64.zip ferry)

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          macos/bundle.sh target/release/ferry work
          mkdir -p dist
          ditto -c -k --keepParent work/Ferry.app dist/ferry-macos-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ferry-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ferry ${GITHUB_REF_NAME#v}" \
            --generate-notes
