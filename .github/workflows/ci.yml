# Checks Tidings on Linux, Windows and macOS: formatting, Clippy and the tests.
# Runs on pull requests, on pushes to main, and when started by hand from the
# Actions tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer run of a branch replaces its older one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the code is checked with, so that a new Rust release's lints
  # do not fail builds of unchanged code.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      # The BlueZ and tray tests run against a private D-Bus.
      - name: Install D-Bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
