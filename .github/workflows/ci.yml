# Checks Ferry on Linux, Windows and macOS: formatting, Clippy and the tests.
# Builds the Linux packages as the Release workflow does, and installs them on
# Ubuntu and Fedora. Runs on pull requests, on pushes to main, and when
# started by hand from the Actions tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer run of a branch replaces its older one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the code is checked with, so that a new Rust release's lints
  # do not fail builds of unchanged code.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      # The BlueZ and tray tests run against a private D-Bus.
      - name: Install D-Bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  packages:
    name: Linux packages
    # The Release workflow's Linux build.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools
          packaging/linux/package.sh target/release/ferry 1 dist

      - name: Install the Debian package
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/ferry-linux-x86_64.deb
          ferry --help
          sudo apt-get purge -y ferry

      # Checks that dnf finds what the RPM requires, and that its desktop entry
      # and AppStream metadata are valid, with Fedora's current tools.
      - name: Install the RPM on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -euc '
            dnf install -y --setopt=install_weak_deps=False \
              /dist/ferry-linux-x86_64.rpm appstream desktop-file-utils
            ferry --help
            desktop-file-validate /usr/share/applications/io.github.ianmarmour.Ferry.desktop
            appstreamcli validate --no-net /usr/share/metainfo/io.github.ianmarmour.Ferry.metainfo.xml
          '

      - name: Run the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/ferry-linux-x86_64.AppImage --help

      # To try a pull request's packages before a release.
      - uses: actions/upload-artifact@v4
        with:
          name: ferry-linux-packages
          path: dist/*
          retention-days: 14
